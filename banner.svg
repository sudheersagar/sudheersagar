<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e17" />
      <stop offset="50%" stop-color="#101726" />
      <stop offset="100%" stop-color="#080c14" />
    </linearGradient>

    <!-- Accent Glow Gradient -->
    <linearGradient id="cyanPurple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58a6ff" />
      <stop offset="50%" stop-color="#8957e5" />
      <stop offset="100%" stop-color="#3fb950" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="techGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1f293d" stroke-width="0.75" stroke-opacity="0.6" />
      <circle cx="40" cy="40" r="1.5" fill="#30363d" />
    </pattern>

    <!-- Circular Avatar Mask -->
    <clipPath id="avatarClip">
      <circle cx="210" cy="200" r="105" />
    </clipPath>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="400" fill="url(#bgGrad)" />
  <rect width="1200" height="400" fill="url(#techGrid)" />

  <!-- Circuit Vectors & Data Nodes -->
  <g stroke="#1f6feb" stroke-width="1.5" stroke-opacity="0.35" fill="none">
    <path d="M 0 100 L 150 100 L 230 180" />
    <path d="M 1200 300 L 1050 300 L 980 230" />
    <path d="M 500 40 L 580 120 L 780 120" />
    <path d="M 850 360 L 920 290 L 1150 290" />
  </g>
  <g fill="#58a6ff" opacity="0.6">
    <circle cx="150" cy="100" r="3.5" />
    <circle cx="1050" cy="300" r="3.5" />
    <circle cx="580" cy="120" r="3.5" />
    <circle cx="920" cy="290" r="3.5" />
  </g>

  <!-- Outer Glow Rings for Profile Picture -->
  <circle cx="210" cy="200" r="116" fill="none" stroke="url(#cyanPurple)" stroke-width="3" opacity="0.85" />
  <circle cx="210" cy="200" r="122" fill="none" stroke="#58a6ff" stroke-width="1" stroke-dasharray="6, 6" opacity="0.4" />

  <!-- Profile Image Imported Live from GitHub (SVG 2 & 1.1 Compliant) -->
  <image href="https://github.com/sudheersagar.png" xlink:href="https://github.com/sudheersagar.png" x="105" y="95" width="210" height="210" clip-path="url(#avatarClip)" />

  <!-- Header Typography -->
  <text x="370" y="145" fill="#f0f6fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="44" font-weight="800" letter-spacing="-0.5">
    Sudheer Putti
  </text>
  
  <text x="370" y="185" fill="#58a6ff" font-family="'Fira Code', monospace" font-size="19" font-weight="600">
    PeopleSoft ERP Architect | Enterprise Solutions | AI Engineer
  </text>

  <text x="370" y="225" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15">
    20+ Years Enterprise Architecture • Campus Solutions • FSCM • HCM • Cloud • Modern Agentic Workflows
  </text>

  <!-- Feature Pills / Badges -->
  <g transform="translate(370, 260)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="140" height="34" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1" />
    <text x="70" y="17" fill="#79c0ff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="600" text-anchor="middle" dominant-baseline="central">PeopleTools &amp; AWE</text>

    <!-- Pill 2 -->
    <rect x="152" y="0" width="130" height="34" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1" />
    <text x="217" y="17" fill="#d2a8ff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="600" text-anchor="middle" dominant-baseline="central">Oracle SQL Tuning</text>

    <!-- Pill 3 -->
    <rect x="294" y="0" width="165" height="34" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1" />
    <text x="376" y="17" fill="#7ee787" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="600" text-anchor="middle" dominant-baseline="central">AI Agents &amp; MCP Tooling</text>

    <!-- Pill 4 -->
    <rect x="471" y="0" width="125" height="34" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1" />
    <text x="533" y="17" fill="#ffa657" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="600" text-anchor="middle" dominant-baseline="central">Cloud Automation</text>
  </g>
</svg>

